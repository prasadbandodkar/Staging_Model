[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "staging-model"
version = "0.1.0"
description = "Staging Model for embryo image processing"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-image>=0.21.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "tensorboard>=2.20.0",
    "tqdm>=4.65.0",
    "kornia>=0.7.0",
]

# Installation instructions:
# =======================
#
# For CUDA support (Linux with NVIDIA GPUs):
#   CUDA 11.8: uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cu118
#   CUDA 12.1: uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
#   Then: uv pip install -e .
#
# For MPS support (macOS with Apple Silicon M1/M2/M3):
#   uv pip install torch torchvision
#   Then: uv pip install -e .
#
# For CPU-only (macOS Intel or systems without GPU):
#   uv pip install torch torchvision
#   Then: uv pip install -e .
#
# The code automatically detects and uses available hardware acceleration:
#   Priority: CUDA > MPS > CPU

[project.optional-dependencies]
cuda118 = []  # Empty, but triggers the index-url for torch/torchvision
cuda121 = []  # Empty, but triggers the index-url for torch/torchvision

[tool.hatch.build.targets.wheel]
packages = ["src"]
