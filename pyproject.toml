[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "staging-model"
version = "0.1.0"
description = "Staging Model for embryo image processing"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-image>=0.21.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "tqdm>=4.67.1",
    "pyyaml>=6.0.0",
    "tensorboard>=2.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
