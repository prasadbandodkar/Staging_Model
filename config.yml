# ==============================================================================
# Staging Model Configuration
# ==============================================================================
# This config supports both regression and classification tasks.
# Set task.type to switch between modes.
# ==============================================================================

# ==============================================================================
# TASK CONFIGURATION
# ==============================================================================
# Defines the learning task: regression or classification
task:
  type: "regression"  # Options: regression, classification

  # Classification settings (only used when type=classification)
  # Note: Regression IDs from id.csv are automatically binned into classes
  # Example for num_classes=2: [0.0, 0.5) → class 0, [0.5, 1.0] → class 1
  # Example for num_classes=5: [0.0, 0.2) → class 0, [0.2, 0.4) → class 1, etc.
  classification:
    num_classes: 15  # Number of classes (IDs are binned into equal intervals)
    class_names: null  # Optional: ["stage1", "stage2", ...] for logging


# ==============================================================================
# DATA CONFIGURATION
# ==============================================================================
data:
  # --- Paths ---
  paths:
    root: "/Volumes/X2/Projects/phd/staging/data/live_data_unrolled20x/"
    metadata: "/Volumes/X2/Projects/phd/staging/Staging_Model/metadata.csv"

  # --- Dataset Splits ---
  splits:
    test_ids: [20, 42]
    val_ids: [33, 40]
    ignore_ids: [31]
    # train_ids are automatically determined (all folders not in test/val/ignore)

  # --- Image Type ---
  # Indicates the type of images used for training
  # Options: unrolled, original
  # Note: The unroll-on-fly pipeline always results in unrolled images
  image_type: "unrolled"

  # --- Data Loading ---
  loading:
    use_unroll_on_fly: false  # When false: load pre-processed unrolled images
                               # When true: unroll images on-the-fly using unroll_on_fly config
                               # Requires: unroll_on_fly.augmentation.interpolation.enabled=false

    trunc_width: 512  # Width truncation/cropping applied during loading
                      # Training: random crop, Validation: center crop
                      # Set to null to disable truncation

    num_workers: 6  # MPS requires 0 (no subprocesses); use 4-8 only on CUDA/CPU

  # --- Unroll On-The-Fly Configuration ---
  # Used only when loading.use_unroll_on_fly=true
  # This pipeline always produces unrolled images
  unroll_on_fly:
    # Target dimensions for unrolled images
    img_height: 1024
    img_width: 1024
    
    padding: 44

    # Unrolling parameters
    npoints: 60  # Number of points for contour representation

    # Nuclear layer boundary extension (different for cross-section vs sagittal)
    boundary_extension:
      cross_section:
        outward: -28  # Negative → extends outward (away from center) → outer edge
        inward: 100    # Positive → extends inward (toward center) → inner edge
      sagittal:
        outward: -20
        inward: 70

    # Folder classification
    sagittal_folder_prefixes: [6, 7, 40, 41, 42, 43]

    # PPM normalization
    target_ppm: null  # Target pixels-per-micron (null = no normalization)

    # --- Augmentation Settings ---
    augmentation_enabled: false  # Enable/disable all augmentation

    # Interpolation augmentation (randomly blend adjacent images)
    interpolation_enabled: false  # When true, randomly interpolate between adjacent images
    interpolation_distribution: "uniform"  # Options: uniform, beta
    interpolation_beta_alpha: 0.5  # Alpha parameter for Beta distribution
    interpolation_beta_beta: 0.5   # Beta parameter for Beta distribution


# ==============================================================================
# MODEL CONFIGURATION
# ==============================================================================
model:
  architecture: "tiny"  # Options: nano, tiny, small, medium, large
                         # nano:   <150k params
                         # tiny:   ~700k params
                         # small:  ~11M params (ResNet18-like)
                         # medium: ~25M params (ResNet34-like)
                         # large:  ~45M params (ResNet101-like)

  dropout: 0.60  # Dropout rate for regularization
  show_summary: true  # Print model summary at startup
  
  # --- Architectural Enhancements ---
  # Advanced settings for model architecture customization
  
  # Activation function used throughout the model
  activation: "gelu"  # Options: gelu, relu, mish, leaky_relu
                      # gelu: Gaussian Error Linear Unit (smooth gradients, best for regression)
                      # relu: Standard ReLU (faster, good baseline)
                      # mish: Self-regularized non-monotonic (smooth like GELU)
                      # leaky_relu: Leaky ReLU (prevents dead neurons)
  
  # Normalization layer configuration
  normalization:
    type: "group_norm"  # Options: group_norm, batch_norm
                        # group_norm: Batch-size independent (recommended for small batches)
                        # batch_norm: Traditional BatchNorm (requires larger batch sizes)
    
    num_groups: 32  # Number of groups for GroupNorm (only used if type=group_norm)
                    # Will be auto-adjusted for small models (e.g., nano)
                    # Typical values: 16, 32 (must divide channel count)
  
  # Squeeze-and-Excitation (SE) channel attention
  se_block:
    enabled: true  # Enable SE blocks for channel attention
    reduction: 16  # Reduction ratio for SE bottleneck (higher = fewer params)
                   # Typical values: 4, 8, 16
                   # Lower = more expressive but more parameters
  
  # Residual block design
  residual_block:
    pre_activation: true  # Use pre-activation design (GN→Activation→Conv)
                          # true: Better gradient flow, recommended
                          # false: Traditional post-activation (Conv→GN→Activation)


# ==============================================================================
# TRAINING CONFIGURATION
# ==============================================================================
training:
  # --- Optimization ---
  optimizer:
    learning_rate: 1.0e-3
    weight_decay: 1.0e-2  # L2 regularization

  # --- Loss Function ---
  loss:
    # Regression losses: mse, smooth_l1, huber
    # Classification losses: cross_entropy (auto-selected based on task.type)
    type: "mse"

    # Huber loss parameters (only used if type=huber)
    huber_delta: 1.0

  # --- Learning Rate Scheduler ---
  scheduler:
    type: "reduce_on_plateau"  # Currently only this type supported
    factor: 0.5      # Multiply LR by this when reducing
    patience: 5      # Epochs with no improvement before reducing LR
    warmup_epochs: 5  # Number of epochs for linear LR warmup (0 = disabled)

  # --- Regularization ---
  regularization:
    grad_clip: 1.0  # Gradient clipping (0.0 = disabled, typical: 0.5-5.0)
    
    # Dropout Schedule: Dynamically adjust dropout during training
    # Options: 
    #   - "constant": Fixed dropout (uses model.dropout value)
    #   - "linear": Linearly increase from dropout_start to dropout_end
    #   - "step": Increase dropout at specific epochs
    dropout_schedule:
      type: "linear"  # Options: constant, linear, step
      dropout_start: 0.3  # Starting dropout rate (only for linear/step)
      dropout_end: 0.7    # Ending dropout rate (only for linear/step)
      # Step schedule (only used if type=step)
      step_epochs: [20, 40, 60]  # Epochs to increase dropout
      step_values: [0.3, 0.5, 0.6, 0.7]  # Dropout values at each step

  # --- Training Duration --- 
  batch_size: 64
  epochs: 100
  early_stopping: 100  # Stop if no improvement for N epochs (0 = disabled)

  # --- Checkpointing ---
  checkpoint_dir: "./checkpoints"  # Relative to run directory


# ==============================================================================
# RUN MANAGEMENT
# ==============================================================================
runs:
  base_dir: "./runs"
  auto_name: true  # Auto-generate timestamp-based run names
  save_config: true  # Save config snapshot in run directory
  tensorboard_enabled: true


# ==============================================================================
# SYSTEM SETTINGS
# ==============================================================================
system:
  seed: 42  # Random seed for reproducibility
  device: "auto"  # Options: auto, cuda, mps, cpu
                  # auto = use GPU if available, else CPU
